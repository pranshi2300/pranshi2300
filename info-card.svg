  </text>

  <text
    class="line l8"
    x="120"
    y="300"
    font-size="15"
    fill="#c9d1d9">
    RoomCraft · FinMate
  </text>

  <!-- Tools -->
  <text
    class="line l9"
    x="30"
    y="330"
    font-size="15"
    fill="#39d353">
