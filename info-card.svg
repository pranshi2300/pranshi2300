<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="410"
     viewBox="0 0 700 410">

  <style>
    .line {
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 0.6s; }
    .l3 { animation-delay: 0.9s; }
    .l4 { animation-delay: 1.2s; }
    .l5 { animation-delay: 1.5s; }
    .l6 { animation-delay: 1.8s; }
    .l7 { animation-delay: 2.1s; }
    .l8 { animation-delay: 2.4s; }
    .l9 { animation-delay: 2.7s; }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    text {
      font-family: monospace;
    }
  </style>

  <!-- Terminal window -->
  <rect
    x="5"
    y="5"
    width="690"
    height="400"
    rx="12"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="2"
  />

  <!-- Terminal buttons -->
  <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="28" r="6" fill="#27c93f"/>

  <!-- Terminal title -->
  <text
    x="95"
    y="34"
    font-size="15"
    fill="#8b949e">
    pranshi2300@github
  </text>

  <!-- Command -->
  <text
    class="line l1"
    x="30"
    y="75"
    font-size="17"
    fill="#39d353">
    $ neofetch
  </text>

  <!-- Username -->
  <text
    class="line l2"
    x="30"
    y="115"
    font-size="22"
    fill="#58a6ff">
    pranshi2300
  </text>

  <!-- Divider -->
  <text
    class="line l3"
    x="30"
    y="145"
    font-size="15"
    fill="#8b949e">
    ─────────────────────────────
  </text>

  <!-- Role -->
  <text
    class="line l4"
    x="30"
    y="180"
    font-size="15"
    fill="#39d353">
    Role:
  </text>

  <text
    class="line l4"
    x="120"
    y="180"
    font-size="15"
    fill="#c9d1d9">
    Computer Science Student
  </text>

  <!-- Focus -->
  <text
    class="line l5"
    x="30"
    y="210"
    font-size="15"
    fill="#39d353">
    Focus:
  </text>

  <text
    class="line l5"
    x="120"
    y="210"
    font-size="15"
    fill="#c9d1d9">
    Software Development
  </text>

  <!-- Languages -->
  <text
    class="line l6"
    x="30"
    y="240"
    font-size="15"
    fill="#39d353">
    Languages:
  </text>

  <text
    class="line l6"
    x="120"
    y="240"
    font-size="15"
    fill="#c9d1d9">
    C++ · Java · Python · JavaScript
  </text>

  <!-- Interests -->
  <text
    class="line l7"
    x="30"
    y="270"
    font-size="15"
    fill="#39d353">
    Interests:
  </text>

  <text
    class="line l7"
    x="120"
    y="270"
    font-size="15"
    fill="#c9d1d9">
    DSA · DBMS · Networks · Compilers
  </text>

  <!-- Projects -->
  <text
    class="line l8"
    x="30"
    y="300"
    font-size="15"
    fill="#39d353">
