  </text>

  <text
    class="line l9"
    x="120"
    y="330"
    font-size="15"
    fill="#c9d1d9">
    Git · GitHub · React · Node
  </text>

  <!-- Status -->
  <text
    class="line l9"
    x="30"
    y="370"
    font-size="14"
    fill="#8b949e">
    Status: learning &amp; building 🚀
  </text>

</svg>
